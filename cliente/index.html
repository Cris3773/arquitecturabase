<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesos 25-26</title>

  <!-- jQuery y cookies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

  <!-- Tu código cliente -->
  <script src="/cliente/ClienteRest.js"></script> 
  <script src="/cliente/controlWeb.js"></script>

  <!-- Google One Tap -->
  <script src="https://accounts.google.com/gsi/client" async defer></script> 

  <style>
    body { padding-top: 56px; }
    @media (min-width: 992px){
      body { padding-top: 64px; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Sistema</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" id="linkInicio">Inicio sesión</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="link2">Link 2</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="linkSalir" style="display:none">Salir</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="container-fluid"> 
    <h3>Arquitectura Base</h3>
    <div class="row">
      <div class="col-md-6">
        <!-- Aquí pintas mensajes, registro, etc -->
        <div id="au"></div>
        <div id="registro"></div>
        <div id="msg"></div>
      </div>
      <div class="col-md-6">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Usuarios del Sistema</h5>
            <span class="badge bg-primary" id="numUsuarios">0</span>
          </div>
          <div class="card-body">
            <ul class="list-group" id="listaUsuarios"></ul>
          </div>
          <div class="card-footer">
            <div class="input-group">
              <input type="text" class="form-control" id="nickBuscar" placeholder="Buscar usuario...">
              <button class="btn btn-outline-primary" id="btnBuscar">Buscar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Google One Tap (valores los rellena el servidor) -->
  <div 
    id="g_id_onload" 
    data-client_id="%%GOOGLE_CLIENT_ID%%" 
    data-login_uri="%%GOOGLE_ONETAP_CALLBACK%%"
    data-skip_prompt_cookie="nick">
  </div>

  <script>
    // Crear objetos globales
    var rest = new ClienteRest();
    var cw   = new ControlWeb();

    // Botón menú "Inicio sesión": muestra el REGISTRO local
    $("#linkInicio").on("click", function(e){
      e.preventDefault();
      cw.mostrarLogin();
    });

    // Botón menú "Salir"
    $("#linkSalir").on("click", function(e){
      e.preventDefault();
      cw.salir();   
    });

    // Arranque de la aplicación
    cw.comprobarSesion();
  </script>
</body>
</html>
