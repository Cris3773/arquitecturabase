<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de usuario</title>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

  <!-- ClienteRest -->
  <script src="cliente/ClienteRest.js"></script>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Sistema</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card shadow">
          <div class="card-header">
            <h4 class="mb-0">Registro de usuario local</h4>
          </div>
          <div class="card-body">

            <!-- FORMULARIO EXACTO DEL PROFESOR -->
            <div id="fmRegistro">
              <form id="formRegistro">

                <div class="form-group mb-3">
                  <label for="apellidos">Apellidos:</label>
                  <input type="text" class="form-control" placeholder="Apellidos" id="apellidos">
                </div>

                <div class="form-group mb-3">
                  <label for="nombre">Nombre:</label>
                  <input type="text" class="form-control" placeholder="Nombre" id="nombre">
                </div>

                <div class="form-group mb-3">
                  <label for="email">Email address:</label>
                  <input type="email" class="form-control" placeholder="Introduce email" id="email">
                </div>

                <div class="form-group mb-3">
                  <label for="pwd">Password:</label>
                  <input type="password" class="form-control" placeholder="Introduce password" id="pwd">
                </div>

                <button type="submit" id="btnRegistro" class="btn btn-primary w-100">
                  Registrar
                </button>

              </form>
            </div>

          </div>

          <div class="card-footer">
            <div id="msgRegistro" class="text-center small"></div>
          </div>

        </div>

        <div class="text-center mt-3">
          <a href="/">Volver al inicio</a>
        </div>

      </div>
    </div>
  </div>

  <!-- Lógica del formulario -->
  
 
</body>
</html>
