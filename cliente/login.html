<!-- cliente/login.html -->
<div id="fmLogin" class="card mt-4">
  <div class="card-body">

    <h3 class="mb-4">Acceder al Sistema</h3>

    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="tu@email.com">
    </div>

    <div class="mb-3">
      <label for="pwd" class="form-label">Contraseña:</label>
      <input type="password" class="form-control" id="pwd" placeholder="Tu contraseña">
    </div>

    <div class="d-flex gap-2 mb-3">
      <button id="btnLogin" class="btn btn-primary">Iniciar Sesión</button>
      <button id="btnIrRegistro" class="btn btn-outline-secondary">Quiero Registrarme</button>
    </div>

    <hr>

    <p class="text-center mb-2">O inicia sesión con:</p>
    <div class="text-center">
      <a href="/auth/google">
        <img src="./cliente/img/boton_google.png" style="height:40px;">
      </a>
    </div>

  </div>
</div>
